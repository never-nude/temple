<div id="temple-explorer">
  <div class="temple-heading"><h2>The Second Temple</h2><span class="text-small text-muted">Jerusalem · Herodian period, c. 30 CE · interpretive reconstruction</span></div>
  <div class="viz-controls" role="group" aria-label="Viewpoints">
    <button class="btn" type="button" data-view="overview" aria-pressed="true">Overview</button>
    <button class="btn" type="button" data-view="east" aria-pressed="false">East entrance</button>
    <button class="btn" type="button" data-view="court" aria-pressed="false">Inner courts</button>
    <button class="btn" type="button" data-view="interior" aria-pressed="false">Inside sanctuary</button>
    <button class="btn" type="button" data-view="stoa" aria-pressed="false">Royal Stoa</button>
  </div>
  <div class="temple-stage" aria-label="Interactive 3D reconstruction of the Second Temple complex">
    <div class="temple-canvas"></div><div class="temple-labels" aria-hidden="true"></div>
    <span class="temple-orientation text-small">N ↑ · east-facing sanctuary</span>
    <span class="temple-loading" role="status">Building the temple…</span>
  </div>
  <div class="viz-controls temple-options">
    <label class="form-check form-switch"><input class="form-check-input" type="checkbox" data-control="cutaway"><span class="form-check-label">Cutaway</span></label>
    <label class="form-check form-switch"><input class="form-check-input" type="checkbox" data-control="labels" checked><span class="form-check-label">Landmarks</span></label>
    <button class="btn" type="button" data-action="tour">Start guided tour</button>
    <button class="btn" type="button" data-action="previous" hidden aria-label="Previous tour stop">Previous</button>
    <button class="btn" type="button" data-action="next" hidden>Next stop</button>
  </div>
  <div class="viz-controls temple-fields">
    <label class="form-label">Explore a landmark<select class="form-select" data-control="landmark" aria-label="Explore a landmark"></select></label>
    <label class="form-label">Sunlight <span data-sun-value class="tabular-nums">Afternoon</span><input class="form-range" type="range" data-control="sun" min="0" max="100" value="65" aria-label="Sunlight, morning to evening"></label>
  </div>
  <div class="temple-detail" aria-live="polite"><span data-detail-title>Temple Mount</span><span class="text-muted" data-detail-text>A monumental raised precinct surrounding the sanctuary and its courts.</span></div>
  <div class="viz-row temple-camera" role="group" aria-label="Camera controls">
    <span class="text-small text-muted">Drag to orbit · pinch or scroll to zoom · shift-drag to pan</span>
    <button class="btn" type="button" data-camera="left" aria-label="Rotate left">↶</button>
    <button class="btn" type="button" data-camera="right" aria-label="Rotate right">↷</button>
    <button class="btn" type="button" data-camera="up" aria-label="Tilt upward">↑</button>
    <button class="btn" type="button" data-camera="down" aria-label="Tilt downward">↓</button>
    <button class="btn" type="button" data-camera="in" aria-label="Zoom in">＋</button>
    <button class="btn" type="button" data-camera="out" aria-label="Zoom out">−</button>
  </div>
</div>
<style>
#temple-explorer{color:var(--foreground);width:100%;position:relative}
#temple-explorer [hidden]{display:none!important}
#temple-explorer .temple-heading{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding-right:90px;margin-bottom:14px}
#temple-explorer h2{margin:0}
#temple-explorer .temple-stage{height:480px;position:relative;width:100%;overflow:hidden;margin:6px 0 12px;touch-action:none}
#temple-explorer .temple-canvas,#temple-explorer .temple-labels{position:absolute;inset:0}
#temple-explorer canvas{display:block;touch-action:none;width:100%;height:100%}
#temple-explorer .temple-labels{pointer-events:none;overflow:hidden}
#temple-explorer .temple-label{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;pointer-events:auto}
#temple-explorer .temple-label[hidden]{display:none}
#temple-explorer .temple-orientation{position:absolute;left:8px;bottom:8px;pointer-events:none;color:var(--foreground);text-shadow:0 1px 3px var(--background),1px 0 3px var(--background),-1px 0 3px var(--background)}
#temple-explorer .temple-loading{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;color:var(--foreground)}
#temple-explorer .temple-loading[hidden]{display:none}
#temple-explorer .temple-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
#temple-explorer .temple-detail{display:flex;gap:8px;flex-wrap:wrap;min-height:46px;align-items:baseline;padding:10px 0}
#temple-explorer [data-detail-title]{font-weight:500}
#temple-explorer .temple-camera{justify-content:flex-start}
#temple-explorer .temple-options{margin-bottom:10px}
@media(max-width:520px){#temple-explorer .temple-stage{height:410px}#temple-explorer .temple-fields{grid-template-columns:1fr;gap:10px}#temple-explorer .temple-heading{align-items:flex-start;gap:4px}#temple-explorer .temple-camera>span{flex-basis:100%}}
</style>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
<script>
/* Herodian sanctuary: an architectural, historically informed reconstruction.
   World axes: east +X, south +Z. Heights and dimensions are in metres.
   Deliberately empty Holy of Holies: the Second Temple had no Ark. */
function buildSanctuary(THREE, ctx) {
  const { mats } = ctx;
  const group = new THREE.Group();
  group.name = 'The sanctuary';
  group.userData.landmark = 'sanctuary';
  const north = new THREE.Group();
  north.name = 'North walls and chambers — removable for cutaway';
  const roofs = new THREE.Group();
  roofs.name = 'Roof and upper chambers — removable for cutaway';
  group.add(north, roofs);

  const B = (p, x, y, z, w, h, d, m = mats.stone) => {
    const mesh = ctx.box(p, x, y, z, w, h, d, m);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    return mesh;
  };
  const mesh = (p, geometry, material, x, y, z) => {
    const obj = new THREE.Mesh(geometry, material);
    obj.position.set(x, y, z);
    obj.castShadow = true;
    obj.receiveShadow = true;
    p.add(obj);
    return obj;
  };
  const cyl = (p, x, y, z, r, h, mat, rt = r, sides = 16) =>
    mesh(p, new THREE.CylinderGeometry(rt, r, h, sides), mat, x, y, z);
  const torus = (p, x, y, z, radius, tube, material, rotation = null) => {
    const t = mesh(p, new THREE.TorusGeometry(radius, tube, 5, 18), material, x, y, z);
    if (rotation) t.rotation.set(...rotation);
    return t;
  };
  const tube = (p, points, radius, material, segments = 18) =>
    mesh(p, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points.map(v => new THREE.Vector3(...v))), segments, radius, 6, false), material, 0, 0, 0);
  const instancedBoxes = (p, entries, material, name) => {
    if (!entries.length) return;
    const m = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), material, entries.length);
    const transform = new THREE.Object3D();
    const color = new THREE.Color();
    entries.forEach((e, i) => {
      transform.position.set(e[0], e[1], e[2]);
      transform.scale.set(e[3], e[4], e[5]);
      transform.rotation.set(0, 0, 0);
      transform.updateMatrix();
      m.setMatrixAt(i, transform.matrix);
      const shade = 0.93 + 0.065 * (0.5 + 0.5 * Math.sin(i * 2.31));
      color.setRGB(shade, shade, shade);
      m.setColorAt(i, color);
    });
    m.name = name;
    m.castShadow = true;
    m.receiveShadow = true;
    m.instanceMatrix.needsUpdate = true;
    if (m.instanceColor) m.instanceColor.needsUpdate = true;
    m.computeBoundingSphere();
    p.add(m);
    return m;
  };

  // Cut ashlar facings. Thin joints and alternate bond give limestone scale
  // without generating a separate scene object for every block.
  function ashlarX(p, x, z0, z1, y0, y1, direction = 1) {
    const entries = [], course = 1.25, length = 2.8;
    for (let row = 0, y = y0; y < y1 - 0.01; row++, y += course) {
      const h = Math.min(course, y1 - y);
      for (let z = z0 - (row % 2) * length / 2; z < z1; z += length) {
        const a = Math.max(z, z0), b = Math.min(z + length, z1);
        if (b - a > 0.08) entries.push([x + direction * 0.045, y + h / 2, (a + b) / 2, 0.09, h - 0.035, b - a - 0.035]);
      }
    }
    instancedBoxes(p, entries, mats.stoneLight, 'Limestone ashlar courses');
  }
  function ashlarZ(p, z, x0, x1, y0, y1, direction = 1) {
    const entries = [], course = 1.25, length = 3.1;
    for (let row = 0, y = y0; y < y1 - 0.01; row++, y += course) {
      const h = Math.min(course, y1 - y);
      for (let x = x0 - (row % 2) * length / 2; x < x1; x += length) {
        const a = Math.max(x, x0), b = Math.min(x + length, x1);
        if (b - a > 0.08) entries.push([(a + b) / 2, y + h / 2, z + direction * 0.045, b - a - 0.035, h - 0.035, 0.09]);
      }
    }
    instancedBoxes(p, entries, mats.stoneLight, 'Limestone ashlar courses');
  }
  function cornice(p, x, z, w, d, y, gold = false) {
    B(p, x, y, z, w, 0.28, d, mats.stoneDark);
    B(p, x, y + 0.3, z, w + 0.35, 0.32, d + 0.35, mats.stoneLight);
    B(p, x, y + 0.63, z, w + 0.7, 0.3, d + 0.7, gold ? mats.gold : mats.stoneLight);
    B(p, x, y + 0.91, z, w + 1.05, 0.26, d + 1.05, mats.stoneLight);
  }

  // Raised platform and twelve broad steps between the altar court and porch.
  B(group, -54.5, 6.0, 0, 42, 1.2, 32, mats.stoneDark);
  B(group, -54.5, 7.0, 0, 41, 0.8, 31.5, mats.stoneLight);
  B(group, -54.5, 7.85, 0, 40.6, 0.9, 31, mats.stone);
  B(group, -29, 6.35, 0, 11, 1.9, 51, mats.stone);
  B(group, -29, 7.78, 0, 10.8, 0.96, 50.7, mats.stoneLight);
  B(group, -29, 8.34, 0, 11.0, 0.16, 51.2, mats.pavement);
  const steps = [];
  for (let i = 0; i < 12; i++) {
    const height = 3 - i * 0.25;
    steps.push([-23.48 + i * 0.58, 5.4 + height / 2, 0, 0.6, height, 31.6]);
  }
  instancedBoxes(group, steps, mats.stoneLight, 'Twelve porch steps');
  B(group, -20.29, 5.64, -16.2, 7.1, 0.48, 0.45, mats.stoneDark);
  B(group, -20.29, 5.64, 16.2, 7.1, 0.48, 0.45, mats.stoneDark);

  // Main interior floor, including the deliberately unfurnished inner chamber.
  B(group, -54, 8.48, 0, 40, 0.16, 29.8, mats.pavement);
  B(group, -49, 8.59, 0, 20, 0.1, 10, mats.stoneLight);
  const holiesFloor = B(group, -64, 8.61, 0, 10, 0.12, 10, mats.stoneLight);
  holiesFloor.name = 'Holy of Holies — an empty chamber';
  holiesFloor.userData.landmark = 'holies';
  const inlay = [];
  for (let x = -68.8; x < -39; x += 2) {
    inlay.push([x, 8.68, -4.83, 1.9, 0.025, 0.07], [x, 8.68, 4.83, 1.9, 0.025, 0.07]);
  }
  for (let z = -4.8; z < 5; z += 2) {
    inlay.push([-68.83, 8.68, z, 0.07, 0.025, 1.9], [-39.16, 8.68, z, 0.07, 0.025, 1.9]);
  }
  instancedBoxes(group, inlay, mats.gold, 'Interior floor border');

  // Three tiers of surrounding chambers, with masonry partitions and ledges.
  for (const sign of [-1, 1]) {
    const side = sign < 0 ? north : group;
    B(side, -54, 19.1, sign * 14.45, 40, 21.4, 1.1, mats.stone);
    ashlarZ(side, sign * 15.0, -74, -34, 8.4, 29.8, sign);
    for (let tier = 0; tier <= 3; tier++) {
      const y = 8.7 + tier * 7;
      B(side, -54, y, sign * 10.6, 40, 0.38, 7.6, mats.stoneLight);
      B(side, -54, y + 0.35, sign * 15.05, 40.4, 0.25, 0.5, mats.stoneDark);
    }
    const partitions = [];
    for (let x = -74; x <= -34.1; x += 5) {
      partitions.push([x, 19.1, sign * 10.65, 0.5, 21.4, 7.4]);
    }
    instancedBoxes(side, partitions, mats.stone, 'Side chamber partitions');
    B(side, -54, 30.1, sign * 11.1, 40.8, 0.7, 8.3, mats.roof);
    B(side, -54, 31.05, sign * 15.2, 41.0, 1.2, 0.42, mats.stoneLight);
    cornice(side, -54, sign * 10.9, 40.4, 8.4, 29.55);
  }
  B(group, -73.3, 19.1, 0, 1.4, 21.4, 29, mats.stone);
  ashlarX(group, -74.0, -15, 15, 8.4, 29.8, -1);

  // Narrow, recessed chamber windows with dressed voussoirs, rather than
  // transparent openings into rooms the model does not claim to reconstruct.
  function archedWindow(p, x, y, z, outward, width = 1.05, height = 2.35) {
    const r = width / 2, s = new THREE.Shape();
    s.moveTo(-r, 0); s.lineTo(r, 0); s.lineTo(r, height - r);
    s.absarc(0, height - r, r, 0, Math.PI, false); s.lineTo(-r, 0);
    const opening = mesh(p, new THREE.ShapeGeometry(s), mats.dark, x, y, z);
    if (outward < 0) opening.rotation.y = Math.PI;
    B(p, x - r - 0.12, y + (height - r) / 2, z, 0.2, height - r, 0.22, mats.stoneDark);
    B(p, x + r + 0.12, y + (height - r) / 2, z, 0.2, height - r, 0.22, mats.stoneDark);
    B(p, x, y - 0.06, z, width + 0.55, 0.18, 0.45, mats.stoneLight);
    const entries = [];
    for (let i = 0; i < 7; i++) {
      const angle = Math.PI * (i + 0.5) / 7;
      const block = B(p, x + Math.cos(angle) * (r + 0.12), y + height - r + Math.sin(angle) * (r + 0.12), z, 0.28, 0.24, 0.25, mats.stoneLight);
      block.rotation.z = angle - Math.PI / 2;
    }
  }
  for (const sign of [-1, 1]) {
    const side = sign < 0 ? north : group;
    for (let row = 0; row < 3; row++) for (let i = 0; i < 7; i++) {
      archedWindow(side, -70.6 + i * 5.4, 10.4 + row * 7, sign * 15.11, sign);
    }
  }

  // The high central house rises above the lower chamber roofs. Removing its
  // upper storey as well as the roof exposes the 15 m high sacred chambers.
  for (const sign of [-1, 1]) {
    const side = sign < 0 ? north : group;
    B(side, -54.5, 15.9, sign * 6.0, 39, 15, 2, mats.stone);
    B(roofs, -54.5, 35.6, sign * 6.3, 39, 24.4, 1.4, mats.stone);
    ashlarZ(roofs, sign * 7.0, -74, -35, 23.4, 47.8, sign);
    for (let i = 0; i < 8; i++) archedWindow(roofs, -70.8 + i * 4.6, 39.2, sign * 7.13, sign, 1.25, 3.4);
    B(roofs, -54.5, 36.5, sign * 7.1, 40, 0.35, 0.35, mats.stoneLight);
    B(roofs, -54.5, 45.7, sign * 7.15, 40.2, 0.42, 0.5, mats.gold);
    B(roofs, -54.5, 46.65, sign * 7.23, 40.6, 0.5, 0.7, mats.stoneLight);
  }
  B(group, -69.65, 15.9, 0, 1.3, 15, 10, mats.stone);
  B(roofs, -73.3, 35.6, 0, 1.4, 24.4, 13.2, mats.stone);
  B(roofs, -35.3, 35.6, 0, 1.4, 24.4, 13.2, mats.stone);
  B(roofs, -54.5, 23.6, 0, 38.2, 0.42, 11.6, mats.gold);
  B(roofs, -54.5, 47.62, 0, 40.2, 0.8, 15.3, mats.roof);
  cornice(roofs, -54.5, 0, 40.3, 15.3, 47.1, true);

  // Gilded interior panels, deeply framed bays, baseboards and upper frieze.
  for (const sign of [-1, 1]) {
    const side = sign < 0 ? north : group;
    B(side, -54, 15.9, sign * 4.97, 30, 15, 0.12, mats.gold);
    B(side, -54, 9.0, sign * 4.82, 30, 0.45, 0.18, mats.gold);
    B(side, -54, 22.95, sign * 4.8, 30, 0.42, 0.22, mats.gold);
    const ribs = [];
    for (let x = -68.8; x < -39; x += 2.0) {
      ribs.push([x, 15.9, sign * 4.78, 0.09, 13.4, 0.15]);
      ribs.push([x + 0.92, 12.5, sign * 4.81, 1.68, 0.08, 0.12]);
      ribs.push([x + 0.92, 19.3, sign * 4.81, 1.68, 0.08, 0.12]);
    }
    instancedBoxes(side, ribs, mats.gold, 'Framed gilded interior panels');
  }
  B(group, -68.94, 15.9, 0, 0.12, 15, 10, mats.gold);
  for (let z = -4.8; z <= 4.8; z += 1.6) B(group, -68.82, 15.9, z, 0.17, 13.6, 0.09, mats.gold);
  B(group, -68.81, 9.0, 0, 0.2, 0.45, 10, mats.gold);
  B(group, -68.81, 22.95, 0, 0.2, 0.42, 10, mats.gold);

  // The curtain is the only furnishing between the two sacred rooms.
  const veil = B(group, -59, 15.9, 0, 0.1, 15, 10, mats.veil);
  veil.name = 'Purple and scarlet sanctuary curtain';
  veil.userData.landmark = 'veil';
  const curtainFolds = [];
  for (let z = -4.86; z <= 4.9; z += 0.54) curtainFolds.push([-58.92, 15.9, z, 0.07, 14.8, 0.08]);
  instancedBoxes(group, curtainFolds, mats.veil, 'Vertical curtain folds');
  B(group, -58.88, 8.78, 0, 0.1, 0.16, 10, mats.gold);
  B(group, -58.88, 23.08, 0, 0.1, 0.26, 10, mats.gold);
  B(group, -58.87, 15.9, -4.8, 0.12, 14.6, 0.1, mats.gold);
  B(group, -58.87, 15.9, 4.8, 0.12, 14.6, 0.1, mats.gold);
  const rod = cyl(group, -59, 23.35, 0, 0.12, 10.7, mats.gold);
  rod.rotation.x = Math.PI / 2;

  // Sanctuary entrance: a tall, gilded double door behind the open porch.
  B(group, -38.75, 15.9, -4.1, 0.8, 15, 1.8, mats.stoneLight);
  B(group, -38.75, 15.9, 4.1, 0.8, 15, 1.8, mats.stoneLight);
  B(group, -38.7, 23.2, 0, 1.0, 1.0, 10, mats.gold);
  for (const sign of [-1, 1]) {
    B(group, -38.18, 15.6, sign * 3.2, 0.3, 14.3, 0.42, mats.gold);
    const door = new THREE.Group();
    door.name = sign < 0 ? 'North gilded door leaf' : 'South gilded door leaf';
    door.position.set(-38.45, 8.65, sign * 3.0);
    door.rotation.y = sign * -0.72;
    group.add(door);
    B(door, 0, 6.0, -sign * 1.45, 0.22, 12, 2.9, mats.wood);
    B(door, 0.14, 6.0, -sign * 1.45, 0.1, 11.9, 2.84, mats.gold);
    for (let row = 0; row < 4; row++) {
      B(door, 0.21, 1.55 + row * 2.9, -sign * 1.45, 0.08, 2.5, 2.45, mats.gold);
      B(door, 0.27, 1.55 + row * 2.9, -sign * 1.45, 0.06, 2.1, 2.04, mats.wood);
    }
    for (let row = 0; row < 5; row++) B(door, 0.31, 0.25 + row * 2.86, -sign * 1.45, 0.11, 0.12, 2.82, mats.gold);
    const handle = torus(door, 0.36, 5.6, -sign * 2.3, 0.19, 0.045, mats.gold);
    handle.rotation.y = Math.PI / 2;
  }

  // Menorah: a central stem and three pairs of sweeping branches, seven lamps.
  const menorah = new THREE.Group();
  menorah.name = 'Seven-branched golden menorah';
  menorah.position.set(-47.6, 8.68, 3.05);
  group.add(menorah);
  cyl(menorah, 0, 0.12, 0, 0.65, 0.24, mats.gold, 0.59, 8);
  cyl(menorah, 0, 0.31, 0, 0.46, 0.18, mats.gold, 0.36, 8);
  cyl(menorah, 0, 1.6, 0, 0.085, 2.45, mats.gold);
  for (let j = 1; j <= 3; j++) for (const sign of [-1, 1]) {
    const reach = j * 0.62;
    tube(menorah, [[0, 0.5 + (3-j)*0.25, 0], [sign*reach*0.55, 0.8 + (3-j)*0.28, 0], [sign*reach, 1.8, 0], [sign*reach, 2.74, 0]], 0.075, mats.gold);
    cyl(menorah, sign*reach, 2.75, 0, 0.105, 0.25, mats.gold, 0.17);
    torus(menorah, sign*reach, 2.9, 0, 0.155, 0.035, mats.gold, [Math.PI/2, 0, 0]);
    cyl(menorah, sign*reach, 2.94, 0, 0.125, 0.06, mats.dark);
  }
  cyl(menorah, 0, 2.75, 0, 0.105, 0.25, mats.gold, 0.17);
  torus(menorah, 0, 2.9, 0, 0.155, 0.035, mats.gold, [Math.PI/2, 0, 0]);
  cyl(menorah, 0, 2.94, 0, 0.125, 0.06, mats.dark);
  for (let y = 0.6; y < 2.6; y += 0.4) {
    const knop = mesh(menorah, new THREE.SphereGeometry(0.14, 10, 6), mats.gold, 0, y, 0);
    knop.scale.y = 0.8;
  }

  // The bread table on the north side holds two stacks of six loaves.
  const table = new THREE.Group();
  table.name = 'Table of the twelve showbreads';
  table.position.set(-47.3, 8.68, -3.02);
  group.add(table);
  B(table, 0, 1.78, 0, 3.1, 0.2, 1.55, mats.gold);
  B(table, 0, 1.93, 0, 3.22, 0.12, 1.68, mats.gold);
  for (const x of [-1.23, 1.23]) for (const z of [-0.53, 0.53]) {
    B(table, x, 0.87, z, 0.17, 1.74, 0.17, mats.gold);
    cyl(table, x, 0.13, z, 0.18, 0.25, mats.gold, 0.13, 8);
  }
  for (const z of [-0.66, 0.66]) B(table, 0, 1.52, z, 2.8, 0.12, 0.1, mats.gold);
  for (const x of [-1.42, 1.42]) B(table, x, 1.52, 0, 0.1, 0.12, 1.3, mats.gold);
  const loafGeo = new THREE.SphereGeometry(1, 14, 8);
  for (const x of [-0.78, 0.78]) for (let i = 0; i < 6; i++) {
    const loaf = mesh(table, loafGeo, mats.wood, x, 2.06 + i * 0.15, 0);
